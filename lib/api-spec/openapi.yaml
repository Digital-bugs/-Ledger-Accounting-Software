openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: partners
    description: Partner management
  - name: dashboard
    description: Dashboard summary
  - name: backup
    description: Backup and restore
  - name: investments
    description: Partner investments
  - name: direct-expenses
    description: Partner direct expenses
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all partners
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard financial summary totals
      responses:
        "200":
          description: Dashboard summary with all totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /backup:
    get:
      operationId: listBackups
      tags: [backup]
      summary: List available database backups
      responses:
        "200":
          description: List of backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
    post:
      operationId: createBackup
      tags: [backup]
      summary: Create a new database backup
      responses:
        "201":
          description: Backup created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"

  /investments/summary:
    get:
      operationId: getInvestmentSummary
      tags: [investments]
      summary: Get investment totals per partner
      responses:
        "200":
          description: Investment summary totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentSummary"

  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      summary: List partner investments with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: partnerId
          in: query
          schema:
            type: number
          description: Filter by partner ID
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of investments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentsPage"

    post:
      operationId: createInvestment
      tags: [investments]
      summary: Create a new partner investment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentBody"
      responses:
        "201":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}:
    put:
      operationId: updateInvestment
      tags: [investments]
      summary: Update an existing investment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentBody"
      responses:
        "200":
          description: Investment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
    delete:
      operationId: deleteInvestment
      tags: [investments]
      summary: Delete an investment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Investment deleted

  /direct-expenses/summary:
    get:
      operationId: getDirectExpenseSummary
      tags: [direct-expenses]
      summary: Get direct expense totals per partner
      responses:
        "200":
          description: Direct expense summary totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpenseSummary"

  /direct-expenses:
    get:
      operationId: listDirectExpenses
      tags: [direct-expenses]
      summary: List partner direct expenses with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: partnerId
          in: query
          schema:
            type: number
          description: Filter by partner ID
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of direct expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpensesPage"

    post:
      operationId: createDirectExpense
      tags: [direct-expenses]
      summary: Create a new partner direct expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectExpenseBody"
      responses:
        "201":
          description: Direct expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpense"

  /direct-expenses/{id}:
    put:
      operationId: updateDirectExpense
      tags: [direct-expenses]
      summary: Update an existing direct expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectExpenseBody"
      responses:
        "200":
          description: Direct expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpense"
    delete:
      operationId: deleteDirectExpense
      tags: [direct-expenses]
      summary: Delete a direct expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Direct expense deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Partner:
      type: object
      required: [id, name, sharePercentage]
      properties:
        id:
          type: number
        name:
          type: string
        sharePercentage:
          type: number

    DashboardSummary:
      type: object
      required:
        - totalInvestments
        - totalDirectExpenses
        - totalPettyCashGiven
        - totalAccountantExpenses
        - totalJointIncome
        - accountantCashBalance
        - partners
      properties:
        totalInvestments:
          type: number
        totalDirectExpenses:
          type: number
        totalPettyCashGiven:
          type: number
        totalAccountantExpenses:
          type: number
        totalJointIncome:
          type: number
        accountantCashBalance:
          type: number
        partners:
          type: array
          items:
            $ref: "#/components/schemas/Partner"

    Backup:
      type: object
      required: [filename, createdAt, sizeBytes]
      properties:
        filename:
          type: string
        createdAt:
          type: string
        sizeBytes:
          type: number

    Investment:
      type: object
      required: [id, receiptNumber, entryDate, description, partnerId, partnerName, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        partnerName:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    InvestmentSummary:
      type: object
      required: [yasirTotal, khurramTotal, combinedTotal]
      properties:
        yasirTotal:
          type: number
        khurramTotal:
          type: number
        combinedTotal:
          type: number

    InvestmentsPage:
      type: object
      required: [data, total, summary]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Investment"
        total:
          type: number
        summary:
          $ref: "#/components/schemas/InvestmentSummary"

    InvestmentBody:
      type: object
      required: [receiptNumber, entryDate, description, partnerId, amount]
      properties:
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        amount:
          type: number

    DirectExpense:
      type: object
      required: [id, receiptNumber, entryDate, description, partnerId, partnerName, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        partnerName:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    DirectExpenseSummary:
      type: object
      required: [yasirTotal, khurramTotal, combinedTotal]
      properties:
        yasirTotal:
          type: number
        khurramTotal:
          type: number
        combinedTotal:
          type: number

    DirectExpensesPage:
      type: object
      required: [data, total, summary]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DirectExpense"
        total:
          type: number
        summary:
          $ref: "#/components/schemas/DirectExpenseSummary"

    DirectExpenseBody:
      type: object
      required: [receiptNumber, entryDate, description, partnerId, amount]
      properties:
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        amount:
          type: number
