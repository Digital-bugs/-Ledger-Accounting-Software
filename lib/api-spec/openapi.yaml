openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: partners
    description: Partner management
  - name: dashboard
    description: Dashboard summary
  - name: backup
    description: Backup and restore
  - name: investments
    description: Partner investments
  - name: direct-expenses
    description: Partner direct expenses
  - name: petty-cash-given
    description: Petty cash given to accountant
  - name: excel-import
    description: Bulk import from Excel or CSV
  - name: reports
    description: Reports and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all partners
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard financial summary totals
      responses:
        "200":
          description: Dashboard summary with all totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /backup:
    get:
      operationId: listBackups
      tags: [backup]
      summary: List available database backups
      responses:
        "200":
          description: List of backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
    post:
      operationId: createBackup
      tags: [backup]
      summary: Create a new database backup
      responses:
        "201":
          description: Backup created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"

  /backup/health:
    get:
      operationId: getBackupHealth
      tags: [backup]
      summary: Run SQLite integrity and foreign-key checks
      responses:
        "200":
          description: Database health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupHealth"

  /backup/settings:
    get:
      operationId: getBackupSettings
      tags: [backup]
      summary: Get backup settings
      responses:
        "200":
          description: Current backup settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettings"
    put:
      operationId: updateBackupSettings
      tags: [backup]
      summary: Update backup settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupSettingsInput"
      responses:
        "200":
          description: Updated backup settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettings"

  /backup/restore:
    post:
      operationId: restoreBackup
      tags: [backup]
      summary: Restore database from a backup file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreInput"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"

  /backup/{filename}:
    delete:
      operationId: deleteBackup
      tags: [backup]
      summary: Delete a backup file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Backup deleted

  /investments/summary:
    get:
      operationId: getInvestmentSummary
      tags: [investments]
      summary: Get investment totals per partner
      responses:
        "200":
          description: Investment summary totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentSummary"

  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      summary: List partner investments with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: partnerId
          in: query
          schema:
            type: number
          description: Filter by partner ID
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of investments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentsPage"

    post:
      operationId: createInvestment
      tags: [investments]
      summary: Create a new partner investment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentBody"
      responses:
        "201":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}:
    put:
      operationId: updateInvestment
      tags: [investments]
      summary: Update an existing investment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentBody"
      responses:
        "200":
          description: Investment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
    delete:
      operationId: deleteInvestment
      tags: [investments]
      summary: Delete an investment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Investment deleted

  /direct-expenses/summary:
    get:
      operationId: getDirectExpenseSummary
      tags: [direct-expenses]
      summary: Get direct expense totals per partner
      responses:
        "200":
          description: Direct expense summary totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpenseSummary"

  /direct-expenses:
    get:
      operationId: listDirectExpenses
      tags: [direct-expenses]
      summary: List partner direct expenses with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: partnerId
          in: query
          schema:
            type: number
          description: Filter by partner ID
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of direct expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpensesPage"

    post:
      operationId: createDirectExpense
      tags: [direct-expenses]
      summary: Create a new partner direct expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectExpenseBody"
      responses:
        "201":
          description: Direct expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpense"

  /direct-expenses/{id}:
    put:
      operationId: updateDirectExpense
      tags: [direct-expenses]
      summary: Update an existing direct expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectExpenseBody"
      responses:
        "200":
          description: Direct expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectExpense"
    delete:
      operationId: deleteDirectExpense
      tags: [direct-expenses]
      summary: Delete a direct expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Direct expense deleted

  /petty-cash-given/summary:
    get:
      operationId: getPettyCashGivenSummary
      tags: [petty-cash-given]
      summary: Get petty cash given totals per partner plus accountant cash balance
      responses:
        "200":
          description: Petty cash given summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashGivenSummary"

  /petty-cash-given:
    get:
      operationId: listPettyCashGiven
      tags: [petty-cash-given]
      summary: List petty cash given records with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: partnerId
          in: query
          schema:
            type: number
          description: Filter by partner ID
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of petty cash given records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashGivenPage"

    post:
      operationId: createPettyCashGiven
      tags: [petty-cash-given]
      summary: Create a new petty cash given record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashGivenBody"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashGivenRecord"

  /petty-cash-given/{id}:
    put:
      operationId: updatePettyCashGiven
      tags: [petty-cash-given]
      summary: Update an existing petty cash given record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashGivenBody"
      responses:
        "200":
          description: Record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashGivenRecord"
    delete:
      operationId: deletePettyCashGiven
      tags: [petty-cash-given]
      summary: Delete a petty cash given record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Record deleted

  /accountant-expenses/summary:
    get:
      operationId: getAccountantExpenseSummary
      tags: [accountant-expenses]
      summary: Get accountant expense summary with cash balance
      responses:
        "200":
          description: Accountant expense summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountantExpenseSummary"

  /accountant-expenses:
    get:
      operationId: listAccountantExpenses
      tags: [accountant-expenses]
      summary: List accountant expenses with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of accountant expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountantExpensesPage"

    post:
      operationId: createAccountantExpense
      tags: [accountant-expenses]
      summary: Create a new accountant expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountantExpenseBody"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountantExpense"

  /accountant-expenses/{id}:
    put:
      operationId: updateAccountantExpense
      tags: [accountant-expenses]
      summary: Update an existing accountant expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountantExpenseBody"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountantExpense"
    delete:
      operationId: deleteAccountantExpense
      tags: [accountant-expenses]
      summary: Delete an accountant expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Expense deleted

  /joint-incomes/summary:
    get:
      operationId: getJointIncomeSummary
      tags: [joint-income]
      summary: Get joint income totals by income type
      responses:
        "200":
          description: Joint income summary by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointIncomeSummary"

  /joint-incomes:
    get:
      operationId: listJointIncomes
      tags: [joint-income]
      summary: List joint income records with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by receipt number or description
        - name: incomeType
          in: query
          schema:
            type: string
          description: Filter by income type (Rent, Office Sale, Flat Sale, Other)
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: number
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema:
            type: number
          description: Rows per page (25, 50, 100)
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction by date
      responses:
        "200":
          description: Paginated list of joint income records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointIncomesPage"

    post:
      operationId: createJointIncome
      tags: [joint-income]
      summary: Create a new joint income record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JointIncomeInput"
      responses:
        "201":
          description: Joint income record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointIncome"

  /joint-incomes/{id}:
    put:
      operationId: updateJointIncome
      tags: [joint-income]
      summary: Update an existing joint income record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JointIncomeInput"
      responses:
        "200":
          description: Joint income record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointIncome"
    delete:
      operationId: deleteJointIncome
      tags: [joint-income]
      summary: Delete a joint income record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Joint income record deleted

  /final-summary:
    get:
      operationId: getFinalSummary
      tags: [final-summary]
      summary: Get the complete final summary and settlement calculation
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
          description: Filter to date (YYYY-MM-DD)
      responses:
        "200":
          description: Final summary with all calculated values and settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalSummaryResult"

  /excel-import:
    post:
      operationId: bulkImport
      tags: [excel-import]
      summary: Bulk import records from Excel or CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /reports/monthly-data:
    get:
      operationId: getReportsMonthlyData
      tags: [reports]
      summary: Get monthly aggregated financial data for charts
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string }
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema: { type: string }
          description: Filter to date (YYYY-MM-DD)
      responses:
        "200":
          description: Monthly aggregated data across all financial categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportData"

  /reports/analytics:
    get:
      operationId: getReportsAnalytics
      tags: [reports]
      summary: Get analytics KPI summary
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string }
          description: Filter from date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema: { type: string }
          description: Filter to date (YYYY-MM-DD)
      responses:
        "200":
          description: Analytics KPI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAnalytics"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Partner:
      type: object
      required: [id, name, sharePercentage]
      properties:
        id:
          type: number
        name:
          type: string
        sharePercentage:
          type: number

    DashboardSummary:
      type: object
      required:
        - totalInvestments
        - totalDirectExpenses
        - totalPettyCashGiven
        - totalAccountantExpenses
        - totalJointIncome
        - accountantCashBalance
        - partners
      properties:
        totalInvestments:
          type: number
        totalDirectExpenses:
          type: number
        totalPettyCashGiven:
          type: number
        totalAccountantExpenses:
          type: number
        totalJointIncome:
          type: number
        accountantCashBalance:
          type: number
        partners:
          type: array
          items:
            $ref: "#/components/schemas/Partner"

    Backup:
      type: object
      required: [filename, createdAt, sizeBytes]
      properties:
        filename:
          type: string
        createdAt:
          type: string
        sizeBytes:
          type: number

    Investment:
      type: object
      required: [id, receiptNumber, entryDate, description, partnerId, partnerName, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        partnerName:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    InvestmentSummary:
      type: object
      required: [yasirTotal, khurramTotal, combinedTotal]
      properties:
        yasirTotal:
          type: number
        khurramTotal:
          type: number
        combinedTotal:
          type: number

    InvestmentsPage:
      type: object
      required: [data, total, summary]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Investment"
        total:
          type: number
        summary:
          $ref: "#/components/schemas/InvestmentSummary"

    InvestmentBody:
      type: object
      required: [receiptNumber, entryDate, description, partnerId, amount]
      properties:
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        amount:
          type: number

    DirectExpense:
      type: object
      required: [id, receiptNumber, entryDate, description, partnerId, partnerName, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        partnerName:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    DirectExpenseSummary:
      type: object
      required: [yasirTotal, khurramTotal, combinedTotal]
      properties:
        yasirTotal:
          type: number
        khurramTotal:
          type: number
        combinedTotal:
          type: number

    DirectExpensesPage:
      type: object
      required: [data, total, summary]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DirectExpense"
        total:
          type: number
        summary:
          $ref: "#/components/schemas/DirectExpenseSummary"

    DirectExpenseBody:
      type: object
      required: [receiptNumber, entryDate, description, partnerId, amount]
      properties:
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        amount:
          type: number

    PettyCashGivenRecord:
      type: object
      required: [id, receiptNumber, entryDate, description, partnerId, partnerName, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        partnerName:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    PettyCashGivenSummary:
      type: object
      required: [yasirTotal, khurramTotal, combinedTotal, accountantCashBalance]
      properties:
        yasirTotal:
          type: number
        khurramTotal:
          type: number
        combinedTotal:
          type: number
        accountantCashBalance:
          type: number

    PettyCashGivenPage:
      type: object
      required: [data, total, summary]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PettyCashGivenRecord"
        total:
          type: number
        summary:
          $ref: "#/components/schemas/PettyCashGivenSummary"

    PettyCashGivenBody:
      type: object
      required: [receiptNumber, entryDate, description, partnerId, amount]
      properties:
        receiptNumber:
          type: string
        entryDate:
          type: string
        description:
          type: string
        partnerId:
          type: number
        amount:
          type: number

    AccountantExpense:
      type: object
      required: [id, receiptNumber, entryDate, description, amount, createdAt]
      properties:
        id:
          type: number
        receiptNumber:
